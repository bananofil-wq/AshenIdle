name: Verify Free Chibi 3D Models
on:
  push:
    branches: [chibi-model-research]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Download CC0 source and inspect rigged meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,zipfile,io,struct,json,re
          url="https://store.godotengine.org/asset/styloo/chibi/download/1373/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/zip,*/*"})
          try:
              with urllib.request.urlopen(req,timeout=55) as res:
                  data=res.read()
                  print("ASSET RESPONSE",res.status,"URL",res.url.split("?")[0],"size",len(data),"content-type",res.headers.get("Content-Type"),flush=True)
          except Exception as e:
              print("CHIBI DOWNLOAD ERROR",type(e).__name__,str(e),flush=True)
              raise
          assert zipfile.is_zipfile(io.BytesIO(data)), data[:100]
          z=zipfile.ZipFile(io.BytesIO(data))
          for info in z.infolist()[:140]:
              print("CHIBI FILE",info.filename,info.file_size)
          for file in z.namelist():
              if file.lower().endswith(('.glb','.gltf')):
                  src=z.read(file)
                  print("CHIBI MODEL",file,"size",len(src),flush=True)
                  if src[:4]==b'glTF':
                      n=struct.unpack_from('<I',src,12)[0]
                      doc=json.loads(src[20:20+n])
                      tris=sum(doc['accessors'][p['indices']]['count']//3 for mesh in doc.get('meshes',[]) for p in mesh['primitives'] if 'indices' in p)
                      print("CHIBI GEOMETRY",file,"tris",tris,"textures",len(doc.get('images',[])),"materials",len(doc.get('materials',[])),"skins",len(doc.get('skins',[])),"animations",[a.get('name','') for a in doc.get('animations',[])],"nodes",len(doc.get('nodes',[])),flush=True)
          PY
