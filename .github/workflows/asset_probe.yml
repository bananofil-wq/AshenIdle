name: Discover free high-detail monster assets
on:
  push:
    branches: [art-pbr-monster-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe publicly free model URLs and asset licensing
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,html,urllib.parse,json
          pages=['https://assetyard.dev/samples/','https://assetyard.dev/pack/','https://assetyard.dev/docs/']
          for url in pages:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  resp=urllib.request.urlopen(req,timeout=25)
                  data=resp.read().decode('utf-8','replace')
                  print('PAGE',url,'status',resp.status,'html_size',len(data),flush=True)
                  for term in ['gloom-stalker','marsh-direwolf','marsh-wraith','hollowreach','\.glb','\.zip','manifest\.json']:
                      print('TERM',term,'hits',len(re.findall(term,data,re.I)))
                      for m in list(re.finditer(term,data,re.I))[:8]:
                          print('CTX',html.unescape(data[max(0,m.start()-180):m.end()+280]).replace('\\n',' ')[:500])
                  seen=set()
                  for match in re.findall(r'(?:href|src|url|download|file)[=:\\s"\\\x27]+([^"\\\x27\s<>]+)',data,re.I):
                      u=html.unescape(match)
                      if ('.glb' in u or '.zip' in u or 'pack' in u or 'manifest' in u) and u not in seen:
                          seen.add(u);print('LINK',u[:260])
              except Exception as e:
                  print('ERROR',url,str(e))
          PY
      - name: Download and inspect free rigged PBR creatures
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,struct,hashlib,re
          for name in ['gloom-stalker','marsh-direwolf','hollow-warden','ashfen-ranger','ashfen-dragon','hollow-wyrm']:
              url='https://assetyard.dev/pack/files/'+name+'.glb'
              try:
                  data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=35).read()
                  if data[:4]!=b'glTF':raise ValueError('not GLB')
                  n=struct.unpack_from('<I',data,12)[0]
                  doc=json.loads(data[20:20+n])
                  tris=sum(doc['accessors'][part['indices']]['count']//3 for mesh in doc.get('meshes',[]) for part in mesh['primitives'] if 'indices' in part)
                  if name == 'marsh-direwolf':
                      nodes=doc.get('nodes',[])
                      for skin in doc.get('skins',[]):
                          print('WOLF BONES', [nodes[i].get('name','') for i in skin['joints']],flush=True)
                  if name == 'hollow-warden':
                      print('WARDEN MODEL NODES', [n.get('name') for n in doc.get('nodes',[]) if any(k in n.get('name','').lower() for k in ['rig','armature','mesh','animation'])],flush=True)
                  print('MODEL',name,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest(),'triangles',tris,'materials',len(doc.get('materials',[])),'textures',len(doc.get('images',[])),'skins',len(doc.get('skins',[])),'animations',[a.get('name') for a in doc.get('animations',[])],'nodes',len(doc.get('nodes',[])),flush=True)
              except Exception as e:
                  print('DOWNLOAD ERROR',name,type(e).__name__,e,flush=True)
          try:
              html=urllib.request.urlopen('https://assetyard.dev/licenses/',timeout=20).read().decode('utf8','replace')
              text=re.sub(r'<[^>]+>',' ',html)
              print('LICENSES',re.sub(r'\\s+',' ',text)[:4500],flush=True)
          except Exception as e:print('LICENSE FETCH ERROR',e)
          PY
