name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ashenidle-build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Godot Android (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Android platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl --fail --location --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-cli" "$ANDROID_HOME/cmdline-tools"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-cli"
            mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Restore stable development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ashenidle-debug-key-v1

      - name: Configure Godot Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          godot --version

      - name: Fetch CC0 animated fantasy models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models
          BASE_HERO="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Characters/gltf"
          BASE_MOB="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0/main/addons/kaykit_character_pack_skeletons/Characters/gltf"
          for character in Knight Barbarian Mage Rogue; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_HERO/$character.glb" -o "assets/models/$character.glb"
          done
          for character in Skeleton_Minion Skeleton_Warrior Skeleton_Rogue Skeleton_Mage; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_MOB/$character.glb" -o "assets/models/$character.glb"
          done
          BASE_DUNGEON="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0/main/addons/kaykit_dungeon_remastered/Assets/gltf"
          for asset in floor_tile_large floor_tile_large_rocks floor_tile_small_broken_A pillar_decorated wall_broken torch_lit; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_DUNGEON/$asset.gltf.glb" -o "assets/models/$asset.glb"
          done
          mkdir -p assets/weapons
          BASE_WEAPON="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/main/addons/kaykit_character_pack_adventures/Assets/gltf"
          for asset in sword_2handed staff dagger; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_WEAPON/$asset.gltf" -o "assets/weapons/$asset.gltf"
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_WEAPON/$asset.bin" -o "assets/weapons/$asset.bin"
          done
          for atlas in knight_texture mage_texture rogue_texture; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_WEAPON/$atlas.png" -o "assets/weapons/$atlas.png"
          done

          test "$(stat -c %s assets/models/Knight.glb)" -gt 1000000
          test "$(stat -c %s assets/models/Skeleton_Minion.glb)" -gt 1000000
          ls -lh assets/models

      - name: Fetch adult-proportioned open fantasy characters and realistic dungeon textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/pbr
          # Models converted to GLB from Quaternius CC0 licensed packs, MIT game-project host.
          BASE_DARK="https://raw.githubusercontent.com/ilrein/warptracker/main/public/models"
          for model in knight hero skeleton ghost demon; do
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_DARK/$model.glb" -o "assets/models/${model}_dark.glb"
            test "$(stat -c %s assets/models/${model}_dark.glb)" -gt 25000
          done
          # Poly Haven CC0 photogrammetry/PBR: real old cobblestone, GL normal mapping.
          BASE_STONE="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/stone_floor"
          for channel in diff nor_gl rough; do
            if ! curl --fail --location --retry 3 --silent --show-error "$BASE_STONE/stone_floor_${channel}_1k.jpg" -o "assets/pbr/stone_floor_${channel}_1k.jpg"; then
              echo "::warning::Stone PBR channel ${channel} unavailable; material falls back to neutral slate"
              rm -f "assets/pbr/stone_floor_${channel}_1k.jpg"
            fi
          done
          # Adult humanoid armour/outfits are made from Quaternius CC0 modular packs.
          # Avelune's GLB pipeline packs all character material maps into the GLBs.
          BASE_ARMOR="https://raw.githubusercontent.com/benjamincanac/avelune/main/public/models/characters"
          for spec in "Knight_Male:ashen_armored_knight" "Knight_Female:ashen_shadow_knight" "Ranger_Male_SimpleParted:ashen_ranger" "Wizard_Male_SimpleParted:ashen_mage" "animations:ashen_shared_anims"; do
            source="${spec%%:*}"
            target="${spec##*:}"
            curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$BASE_ARMOR/$source.glb" -o "assets/models/$target.glb"
            test "$(stat -c %s assets/models/$target.glb)" -gt 100000
          done
          python3 - <<'PY'
          import json,struct
          for model in ["ashen_armored_knight","ashen_ranger","ashen_mage","ashen_shared_anims"]:
              data=open("assets/models/"+model+".glb","rb").read()
              size,kind=struct.unpack_from("<II",data,12)
              gltf=json.loads(data[20:20+size])
              print("GLB DIAG",model,"extensions",gltf.get("extensionsUsed"),"images",len(gltf.get("images",[])),"textures",len(gltf.get("textures",[])))
              print("GLB DIAG TEXTURES",gltf.get("textures",[])[:3])
              print("GLB DIAG IMAGES",[{k:v for k,v in image.items() if k in ("uri","mimeType","bufferView")} for image in gltf.get("images",[])[:3]])
          PY
          python3 -m venv "$RUNNER_TEMP/gltf-tools"
          "$RUNNER_TEMP/gltf-tools/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/gltf-tools/bin/python" scripts/normalize_gltf_for_godot.py assets/models/ashen_*.glb assets/models/*_dark.glb
          ls -lh assets/models/*_dark.glb assets/models/ashen_* assets/pbr/* 2>/dev/null || true

      - name: Download open-licensed fantasy heading font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -g --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel[wght].ttf" -o assets/fonts/Cinzel.ttf
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/OFL.txt" -o assets/fonts/OFL.txt
          test "$(stat -c %s assets/fonts/Cinzel.ttf)" -gt 80000

      - name: Fetch real CC0 RPG and impact audio
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_audio.py
          test "$(find assets/sfx -name '*.ogg' | wc -l)" -ge 25
          ls -lh assets/sfx | tail -5

      - name: Fetch five realistic CC0 biome PBR material sets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_pbr.py
          echo "Photographic material files:"
          find assets/pbr -type f -name '*.jpg' | sort

      - name: Import and validate game scripts
        shell: bash
        run: |
          godot --headless --editor --path . --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' build/import.log; then exit 1; fi

      - name: Smoke-test running game
        shell: bash
        run: |
          godot --headless --path . --quit-after 90 2>&1 | tee build/test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access' build/test.log; then exit 1; fi

      - name: Test combat progression, loot and equipment menus
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/ci_gameplay_test.gd 2>&1 | tee build/gameplay-test.log
          grep -q "GAMEPLAY TEST PASS" build/gameplay-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|GAMEPLAY TEST FAIL|Invalid call|Invalid access' build/gameplay-test.log; then exit 1; fi

      - name: Render portrait screenshot with virtual display
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1920x24" godot --path . --rendering-driver opengl3 --script res://scripts/ci_capture.gd 2>&1 | tee build/visual.log
          ASHEN_CAPTURE_SUFFIX=tall LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1920x24" godot --resolution 720x1600 --path . --rendering-driver opengl3 --script res://scripts/ci_capture.gd 2>&1 | tee build/visual-tall.log
          if [ -s build/gameplay-preview.png ]; then
            file build/gameplay-preview.png
          fi

      - name: Upload actual gameplay preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AshenIdle-Gameplay-Screenshot
          path: |
            build/gameplay-preview*.png
            build/biome-*.png
            build/boss-preview.png
            build/boss-biome-*.png
            build/hero-selection-preview.png
            build/startup-hero-selection.png
            build/hero-detail-preview.png
            build/spell-effects-preview.png
            build/legendary-preview.png
            build/talent-preview.png
            build/inventory-preview.png
            build/evolution-75-preview.png
            build/evolution-500-preview.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Export signed ARM64 Android APK
        shell: bash
        run: |
          godot --headless --path . --export-debug Android build/AshenIdle.apk 2>&1 | tee build/export.log
          test -s build/AshenIdle.apk
          unzip -t build/AshenIdle.apk | tail -1
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/AshenIdle.apk

      - name: Upload APK for installation
        uses: actions/upload-artifact@v4
        with:
          name: AshenIdle-Android-APK
          path: build/AshenIdle.apk
          retention-days: 30

      # Publishing here keeps the direct APK available even if optional video
      # capture or encoding fails on a software-rendered CI runner.
      - name: Publish direct-download Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Ashen Idle - Android Preview
          body: Portrait Android development preview. APK is debug-signed for testing.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/AshenIdle.apk

      - name: Render and encode genuine moving gameplay QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/motion
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1920x24" \
            godot --resolution 720x1280 --path . --rendering-driver opengl3 \
            --script res://scripts/ci_motion.gd 2>&1 | tee build/motion.log
          test "$(find build/motion -name '*.jpg' | wc -l)" -eq 96
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -framerate 30 \
            -i build/motion/%03d.jpg -c:v libx264 -preset veryfast -crf 24 \
            -pix_fmt yuv420p -movflags +faststart build/gameplay-motion.mp4
          test -s build/gameplay-motion.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 build/gameplay-motion.mp4

      - name: Upload real moving gameplay preview
        uses: actions/upload-artifact@v4
        with:
          name: AshenIdle-Motion-Preview
          path: build/gameplay-motion.mp4
          retention-days: 30

      - name: Attach optional gameplay motion video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          prerelease: true
          make_latest: false
          files: build/gameplay-motion.mp4

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AshenIdle-Build-Logs
          path: build/*.log
          if-no-files-found: ignore
